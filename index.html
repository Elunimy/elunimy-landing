<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Elunimy - your personal home for everything worth keeping. Save notes, links, documents and photos, then find any of them later by meaning. Available on iOS and Android.">
  <meta name="theme-color" content="#0E0E10">
  <title>Elunimy - Save anything. Find by meaning.</title>

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://join.elunimy.com">
  <meta property="og:title" content="Elunimy">
  <meta property="og:description" content="Save anything, find it later by meaning. Available on iOS and Android.">
  <meta property="og:image" content="https://join.elunimy.com/assets/icon.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Elunimy">
  <meta name="twitter:description" content="Save anything, find it later by meaning. Available on iOS and Android.">
  <meta name="twitter:image" content="https://join.elunimy.com/assets/icon.png">

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="canonical" href="https://join.elunimy.com">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0E0E10;
      --ink: #F3F3F4;
      --muted: #9B9B9F;
      --body: #B6B6BC;
      --faint: #6E6E73;
      --hair: rgba(255, 255, 255, 0.10);
    }

    html { min-height: 100%; -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: var(--body);
      background:
        radial-gradient(900px 520px at 50% -10%, rgba(255, 255, 255, 0.055), transparent 70%),
        var(--bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 24px;
    }

    main {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .icon {
      width: 104px;
      height: 104px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45), 0 0 0 1px var(--hair);
      display: block;
    }

    h1 {
      margin: 26px 0 0;
      font-size: 46px;
      font-weight: 700;
      letter-spacing: -0.035em;
      color: var(--ink);
      line-height: 1;
    }

    .tagline {
      margin: 14px 0 0;
      font-size: 17px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: -0.01em;
    }

    .desc {
      margin: 22px 0 0;
      max-width: 460px;
      font-size: 16px;
      line-height: 1.6;
      color: var(--body);
      text-wrap: balance;
    }

    .stores {
      margin: 38px 0 0;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }
    .store {
      display: inline-flex;
      transition: opacity 120ms ease, transform 120ms ease;
    }
    .store:hover { opacity: 0.88; }
    .store:active { opacity: 0.7; transform: translateY(1px); }
    .store:focus-visible { outline: 2px solid rgba(255,255,255,0.6); outline-offset: 4px; border-radius: 10px; }

    .store--apple img { height: 54px; width: auto; display: block; }
    .store--google img { height: 80px; width: auto; display: block; }

    .support {
      position: fixed;
      top: 20px;
      right: 22px;
      font-size: 14px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      padding: 6px 4px;
      transition: color 120ms ease;
      z-index: 10;
    }
    .support:hover { color: var(--ink); }
    .support:focus-visible { outline: 2px solid rgba(255,255,255,0.6); outline-offset: 3px; border-radius: 8px; }

    footer {
      margin: 44px 0 0;
      font-size: 13px;
      display: flex;
      justify-content: center;
      gap: 22px;
    }
    footer a {
      color: var(--muted);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
    }
    footer a:hover { color: var(--ink); }

    @media (max-width: 420px) {
      h1 { font-size: 40px; }
      .icon { width: 92px; height: 92px; border-radius: 21px; }
      .store--apple img { height: 48px; }
      .store--google img { height: 71px; }
    }
  </style>
</head>
<body>
  <a class="support" href="https://legal.elunimy.com/support.html">Support</a>

  <main>
    <img class="icon" src="assets/icon.png" alt="Elunimy app icon" width="104" height="104">

    <h1>Elunimy</h1>
    <p class="tagline">Save anything. Find by meaning.</p>

    <p class="desc">
      Your personal home for everything worth keeping - notes, links, documents and photos.
      Find any of them later by meaning, not just the exact words you remember.
    </p>

    <div class="stores">
      <a class="store store--apple"
         href="https://apps.apple.com/app/elunimy/id6763498630"
         aria-label="Download Elunimy on the App Store">
        <img src="assets/app-store-badge.svg" alt="Download on the App Store">
      </a>
      <a class="store store--google"
         href="https://play.google.com/store/apps/details?id=com.elunimy.app"
         aria-label="Get Elunimy on Google Play">
        <img src="assets/google-play-badge.png" alt="Get it on Google Play">
      </a>
    </div>

    <footer>
      <a href="https://legal.elunimy.com/privacy-policy.html">Privacy</a>
      <a href="https://legal.elunimy.com/terms-and-conditions.html">Terms</a>
    </footer>
  </main>
</body>
</html>
